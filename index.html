<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<script>
/* Sync restore FIRST: app replaces gate; gate CSS is scoped to html.gate */
(function(){
  try {
    var cached = sessionStorage.getItem('anzol_app_html');
    if (cached) {
      sessionStorage.removeItem('anzol_app_html');
      window.__ANZOL_RESTORED__ = true;
      document.write(cached);
      document.addEventListener('DOMContentLoaded', function(){
        var g=document.getElementById('gate'); if (g) g.remove();
      });
      return;
    }
  } catch (e) {}
  document.documentElement.classList.add('gate');
})();
</script>

<style>
:root{--bg:#050a12;--cyan:#00f0ff;--gold:#ffd700;--text:#e8f4ff;--muted:#7a9bb8;--red:#ff3b5c}
html.gate *{box-sizing:border-box;margin:0;padding:0}
html.gate{height:100%;background:#050a12}
html.gate body{min-height:100vh;min-height:100dvh;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SF Mono,Segoe UI,monospace;
background:radial-gradient(ellipse at 20% 0%,#0d1b2e 0%,var(--bg) 55%,#020508 100%);color:var(--text)}
html.gate .card{width:min(420px,92vw);padding:28px;border:1px solid rgba(0,240,255,.28);border-radius:16px;
background:rgba(10,24,40,.82);backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(0,240,255,.08)}
html.gate h1{font-size:15px;letter-spacing:.16em;color:var(--cyan);margin-bottom:6px}
html.gate .sub{color:var(--muted);font-size:12px;margin-bottom:22px}
html.gate label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.08em}
html.gate input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(0,240,255,.35);
background:#071018;color:var(--text);font:inherit;outline:none}
html.gate input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,.15)}
html.gate button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;cursor:pointer;
background:linear-gradient(135deg,var(--cyan),#0088aa);color:#031018;font-weight:700;letter-spacing:.1em}
html.gate button:disabled{opacity:.5;cursor:wait}
html.gate .err{color:var(--red);font-size:12px;margin-top:12px;min-height:18px}
html.gate .ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan);margin-bottom:14px}
</style>
</head>

const ITER = PAYLOAD.iterations || 600000;
function b64ToBytes(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(password, salt){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  const btn=document.getElementById('go');
  err.textContent='';
  if(!pw){err.textContent='Informe a senha.';return}
  btn.disabled=true; err.textContent='Descriptografando…';
  try{
    const key=await deriveKey(pw,b64ToBytes(PAYLOAD.salt));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(PAYLOAD.iv)},key,b64ToBytes(PAYLOAD.data));
    const html=new TextDecoder().decode(pt);
    sessionStorage.setItem('anzol_app_html', html);
    sessionStorage.setItem('anzol_unlocked','1');
    location.reload();
  }catch(e){
    err.textContent='Senha incorreta.';
    btn.disabled=false;
  }
}
if(document.getElementById('go'))document.getElementById('go').addEventListener('click',unlock);
if(document.getElementById('pw'))document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
